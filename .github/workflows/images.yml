name: Menu photos
on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Item ids to re-search (space separated, optional)'
        required: false
  push:
    branches: [main]
    paths: ['scripts/images/queries.json', 'scripts/images/picks.json', 'scripts/images/*.mjs']
permissions:
  contents: write
concurrency: menu-photos
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock sharp@0.33.5
      - run: node scripts/images/search.mjs ${{ github.event.inputs.ids }}
      - run: node scripts/images/fetch.mjs
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/images assets/menu data/image-credits.json
          git diff --cached --quiet || git commit -m "Update menu photos [automated]"
          git pull --rebase origin main && git push origin HEAD:main
